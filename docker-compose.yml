services:
  # ----------------------------------------------------------------------------
  # FastAPI Core Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: outreach_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./backend/app:/app/app:ro
      - ./ai:/app/ai:ro
      - ./contracts:/app/contracts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - outreach_network

  # ----------------------------------------------------------------------------
  # n8n Automation Engine (Self-hosted Community Edition)
  # ----------------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: outreach_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automation/n8n/workflows:/data/workflows:ro
    networks:
      - outreach_network

  # ----------------------------------------------------------------------------
  # Caddy Reverse Proxy & Automatic HTTPS
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: outreach_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - outreach_network

  # ----------------------------------------------------------------------------
  # Optional Local PostgreSQL (Fallback for local dev if Neon DB is offline)
  # ----------------------------------------------------------------------------
  local_postgres:
    image: postgres:16-alpine
    container_name: outreach_local_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      POSTGRES_DB: crm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - outreach_network
    profiles:
      - local-db

networks:
  outreach_network:
    driver: bridge

volumes:
  n8n_data:
  caddy_data:
  caddy_config:
  postgres_data:
